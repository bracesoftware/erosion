name: Sync README to Modrinth

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync README to Modrinth
        uses: modrinth/readme-sync@v1
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project-id: 'erosion-mod'
          readme-path: 'README.md'