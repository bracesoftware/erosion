name: Sync README to Modrinth

on:
  push:
    branches:
      - main
    paths:
      - README.md
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync README to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail

          echo "Reading README.md..."

          jq -n \
            --rawfile body README.md \
            '{body: $body}' \
            > modrinth-payload.json

          echo "Updating Modrinth project..."

          curl --fail-with-body \
            --request PATCH \
            --url "https://api.modrinth.com/v2/project/erosion-mod" \
            --header "Authorization: ${MODRINTH_TOKEN}" \
            --header "Content-Type: application/json" \
            --header "User-Agent: Erosion-Mod-GitHub-Actions" \
            --data-binary @modrinth-payload.json

          echo
          echo "Modrinth description updated successfully!"