name: Sync README to Modrinth

on:
  push:
    branches:
      - main
    paths:
      - README.md

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync README to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -e

          jq -n \
            --rawfile body README.md \
            '{body: $body}' \
            > payload.json

          curl --fail-with-body \
            -X PATCH \
            "https://api.modrinth.com/v2/project/erosion-mod" \
            -H "Authorization: ${MODRINTH_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Erosion-Mod-GitHub-Actions" \
            --data-binary @payload.json

          echo "README successfully synced to Modrinth."