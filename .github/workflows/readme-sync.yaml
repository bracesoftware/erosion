name: Sync README to Modrinth

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Modrinth Project Description
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          README_CONTENT=$(cat README.md | jq -sR .)          
          curl -X PATCH "https://api.modrinth.com/v2/project/erosion-mod" \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: github-actions-readme-sync" \
            -d "{\"body\": $README_CONTENT}"