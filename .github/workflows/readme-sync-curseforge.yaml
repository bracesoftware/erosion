name: Sync README to CurseForge

on:
  push:
    branches:
      - main
    paths:
      - README.md

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync README to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
        run: |
          set -e

          jq -n \
            --rawfile body README.md \
            '{description: $body, descriptionType: "markdown"}' \
            > payload.json

          RESPONSE=$(curl -s -w "%{http_code}" -o response.txt \
            -X POST \
            "https://minecraft.curseforge.com/api/projects/${CURSEFORGE_PROJECT_ID}/edit" \
            -H "X-Api-Token: ${CURSEFORGE_TOKEN}" \
            -F "metadata=<payload.json")

          echo "HTTP Status Code: $RESPONSE"
          cat response.txt

          if [ "$RESPONSE" -ne 200 ] && [ "$RESPONSE" -ne 202 ]; then
            echo "Failed to sync README to CurseForge"
            exit 1
          fi

          echo "README successfully synced to CurseForge."