name: Sync README to CurseForge

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
  workflow_dispatch:

jobs:
  sync-description:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitorija
        uses: actions/checkout@v4

      - name: Sinhronizuj opis na CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
        run: |
          node -e '
          const fs = require("fs");
          const https = require("https");

          const token = process.env.CURSEFORGE_TOKEN;
          const projectId = process.env.CURSEFORGE_PROJECT_ID;

          if (!token || !projectId) {
            console.error("err: missing CURSEFORGE_TOKEN and CURSEFORGE_PROJECT_ID!");
            process.exit(1);
          }

          const readmeText = fs.readFileSync("README.md", "utf8");

          const metadata = JSON.stringify({
            description: readmeText,
            descriptionType: "markdown"
          });

          const boundary = "----WebKitFormBoundary" + Math.random().toString(36).substring(2);
          
          let body = "";
          body += `--${boundary}\r\n`;
          body += `Content-Disposition: form-data; name="metadata"\r\n\r\n`;
          body += `${metadata}\r\n`;
          body += `--${boundary}--\r\n`;

          const options = {
            hostname: "minecraft.curseforge.com",
            path: `/api/projects/${projectId}/edit`,
            method: "POST",
            headers: {
              "X-Api-Token": token,
              "Content-Type": `multipart/form-data; boundary=${boundary}`,
              "Content-Length": Buffer.byteLength(body, "utf8")
            }
          };

          const req = https.request(options, (res) => {
            console.log(`HTTP Status: ${res.statusCode}`);
            let data = "";
            res.on("data", chunk => data += chunk);
            res.on("end", () => {
              console.log("server:", data);
              if (res.statusCode >= 200 && res.statusCode < 300) {
                console.log("readme sync!");
              } else {
                console.error("curseforge err!");
                process.exit(1);
              }
            });
          });

          req.on("error", (err) => {
            console.error("Network err:", err);
            process.exit(1);
          });

          req.write(body);
          req.end();
          '