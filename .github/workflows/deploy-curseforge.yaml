name: Publish Release to CurseForge

on:
  push:
    tags:
      - 'build*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p release

          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "Erosion-neoforge.jar" \
            --dir release

          echo "Downloaded:"
          ls -lh release/Erosion-neoforge.jar

      - name: Prepare Version Data
        run: |
          set -e

          BUILD_VERSION="${GITHUB_REF_NAME#build}"
          SNAPSHOT_VERSION=$(cat snapshot.txt)

          VERSION="${BUILD_VERSION}.${SNAPSHOT_VERSION}"
          DISPLAY_NAME="build ${BUILD_VERSION} snapshot ${SNAPSHOT_VERSION}"

          echo "Build version: ${BUILD_VERSION}"
          echo "Snapshot version: ${SNAPSHOT_VERSION}"
          echo "Publishing version: ${VERSION}"

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "DISPLAY_NAME=${DISPLAY_NAME}" >> "$GITHUB_ENV"

      - name: Upload to CurseForge
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          project_id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          file_path: 'release/Erosion-neoforge.jar'
          game_endpoint: 'minecraft'
          game_versions: '1.21.1,NeoForge'
          display_name: ${{ env.DISPLAY_NAME }}
          changelog: 'Automated release ${{ env.VERSION }}'
          release_type: 'release'