name: Publish Release to CurseForge

on:
  push:
    tags:
      - 'build*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload to CurseForge
        uses: mc-mod-core/curseforge-upload@v2
        with:
          api-token: ${{ secrets.CURSEFORGE_TOKEN }}
          project-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          # Prilagodi putanju gdje tvoj Gradle izbacuje gotov JAR (obično build/libs)
          file-path: 'build/libs/Erosion-neoforge.jar'
          game-versions: |
            1.21.1
            NeoForge
          changelog: 'Automated release ${{ github.ref_name }}'
          release-type: 'release'