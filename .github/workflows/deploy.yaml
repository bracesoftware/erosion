name: Publish Release to Modrinth

on:
  push:
    tags:
      - 'build*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Download JAR from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p release

          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "Erosion-neoforge.jar" \
            --dir release

          echo "Downloaded:"
          ls -lh release/

      - name: Publish JAR to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -e

          curl --fail-with-body \
            --request POST \
            "https://api.modrinth.com/v2/version" \
            --header "Authorization: ${MODRINTH_TOKEN}" \
            --header "User-Agent: Erosion-Mod-GitHub-Actions" \
            --form "data={
              \"project_id\":\"erosion-mod\",
              \"version_number\":\"${GITHUB_REF_NAME#build}\",
              \"version_title\":\"${GITHUB_REF_NAME}\",
              \"version_type\":\"release\",
              \"loaders\":[\"neoforge\"],
              \"game_versions\":[\"1.21.1\"],
              \"featured\":true
            }" \
            --form "file=@release/Erosion-neoforge.jar"

          echo "Published ${GITHUB_REF_NAME} to Modrinth."