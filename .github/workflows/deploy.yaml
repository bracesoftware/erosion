name: Publish Release to Modrinth

on:
  push:
    tags:
      - 'build*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p release

          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "Erosion-neoforge.jar" \
            --dir release

          echo "Downloaded:"
          ls -lh release/Erosion-neoforge.jar

      - name: Get Modrinth project ID
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -e

          PROJECT_ID=$(curl --fail-with-body -s \
            "https://api.modrinth.com/v2/project/erosion-mod" \
            -H "Authorization: ${MODRINTH_TOKEN}" \
            -H "User-Agent: Erosion-Mod-GitHub-Actions" \
            | jq -r '.id')

          echo "MODRINTH_PROJECT_ID=${PROJECT_ID}" >> "$GITHUB_ENV"

          echo "Modrinth project ID: ${PROJECT_ID}"

      - name: Publish JAR to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -e

          BUILD_VERSION="${GITHUB_REF_NAME#build}"
          SNAPSHOT_VERSION=$(cat snapshot.txt)

          VERSION="${BUILD_VERSION}.${SNAPSHOT_VERSION}"

          echo "Build version: ${BUILD_VERSION}"
          echo "Snapshot version: ${SNAPSHOT_VERSION}"
          echo "Publishing version: ${VERSION}"

          DATA=$(jq -n \
            --arg project_id "$MODRINTH_PROJECT_ID" \
            --arg version "$VERSION" \
            --arg build "$BUILD_VERSION" \
            --arg snapshot "$SNAPSHOT_VERSION" \
            '{
              name: ("build " + $build + " snapshot " + $snapshot),
              version_number: $version,
              changelog: ("Automated release " + $version),
              dependencies: [],
              project_id: $project_id,
              file_parts: ["file"],
              primary_file: "file",
              version_type: "release",
              loaders: ["neoforge"],
              game_versions: ["1.21.1"],
              featured: true,
              status: "listed"
            }')

          curl --fail-with-body \
            --request POST \
            "https://api.modrinth.com/v2/version" \
            --header "Authorization: ${MODRINTH_TOKEN}" \
            --header "User-Agent: Erosion-Mod-GitHub-Actions" \
            --form "data=${DATA}" \
            --form "file=@release/Erosion-neoforge.jar;type=application/java-archive"

          echo "Successfully published ${VERSION} to Modrinth."